# Install on the host; match this port to APP_PORT in /opt/podcast-app/.env.
upstream podcast_app {
    server 127.0.0.1:8003;
}

server {
    listen 80;
    server_name podcast.example.com;
    server_tokens off;

    # Configure HTTPS with your host TLS tooling before public production use.
    # Keep AUTH_COOKIE_SECURE=true for HTTPS; enable HSTS only after TLS setup.
    access_log /var/log/nginx/podcast-app-access.log;
    error_log /var/log/nginx/podcast-app-error.log;
    client_max_body_size 512m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The app owns authentication, including cookie-authenticated browser APIs.
    # Covers UI, /static/, /api/, /web-api/, /padm/, /m/ and /r/ routes.
    location / {
        proxy_pass http://podcast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
