{% if has_more %}
<div id="episode-more" class="text-center text-sm text-slate-400"
     hx-get="/episodes/more/?offset={{ next_offset }}{% if podcast_id %}&amp;podcast_id={{ podcast_id }}{% endif %}{% for key, value in (filters or {}).items() %}&amp;{{ key|urlencode }}={{ value|urlencode }}{% endfor %}"
     hx-trigger="intersect once root:main" hx-swap="outerHTML" role="status">
    Loading more episodes…
</div>
{% endif %}
