services:
  web:
    image: ${DOCKER_IMAGE:-podcast-app:latest}
    platform: ${APP_PLATFORM:-}
    init: true
    build:
      context: .
      target: "service"
    ports:
      - "127.0.0.1:${APP_PORT:-8003}:${APP_PORT:-8003}"
    env_file:
      - ${APP_ENV_FILE:-.env}
    profiles:
      - service
    environment:
      APP_SERVICE: web
      APP_PORT: ${APP_PORT:-8003}
      APP_VERSION: ${DOCKER_IMAGE_TAG:-latest}
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck", "web"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 60s

  background:
    image: ${DOCKER_IMAGE:-podcast-app:latest}
    platform: ${APP_PLATFORM:-}
    init: true
    build:
      context: .
      target: "service"
    profiles:
      - service
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_SERVICE: background
      APP_VERSION: ${DOCKER_IMAGE_TAG:-latest}
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck", "background"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    env_file:
      - ${APP_ENV_FILE:-.env}
    profiles:
      - service
      - test
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ${PODCAST_DATA_DIR:-./.data}/postgres:/var/lib/postgresql/data/pgdata

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    profiles:
      - service
      - test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ${PODCAST_DATA_DIR:-./.data}/redis:/data

  test:
    image: ${TEST_DOCKER_IMAGE:-podcast-app:test}
    platform: ${APP_PLATFORM:-}
    profiles:
      - test
    env_file:
      - ${APP_ENV_FILE:-.env}
    build:
      context: .
      target: tests
      args:
        DEV_DEPS: true
    environment:
      APP_SERVICE: test
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME to a separate test database}
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  lint:
    image: ${TEST_DOCKER_IMAGE:-podcast-app:test}
    platform: ${APP_PLATFORM:-}
    profiles:
      - test
    env_file:
      - ${APP_ENV_FILE:-.env}
    build:
      context: .
      target: tests
      args:
        DEV_DEPS: true
    environment:
      APP_SERVICE: lint
