name: Scan

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "main"
      - "bugfix/21-opengrep-scan"
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00

permissions:
  contents: read

env:
  OPENGREP_VERSION: "v2.0.0"
  TRUFFLEHOG_VERSION: "v3.90.12"
  GITLEAKS_VERSION: "v8.28.0"

jobs:
  trivy:
    name: trivy-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: image
            scanners: vuln
          - target: fs
            scanners: vuln,misconfig
    env:
      TRIVY_VERSION: "0.76.2"
      TRIVY_SEVERITY: CRITICAL,HIGH,MEDIUM,LOW
      TRIVY_TARGET: ${{ matrix.target }}
      TRIVY_SCANNERS: ${{ matrix.scanners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Build service image
        if: matrix.target == 'image'
        run: |
          image="podcast-app:scan-${GITHUB_SHA}"
          docker build --platform linux/amd64 --target service \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$image" .
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          docker image inspect "$image_id" --format 'ID={{.Id}} OS={{.Os}} Arch={{.Architecture}} Revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Scan image
        if: matrix.target == 'image'
        run: |
          "$RUNNER_TEMP/trivy" image --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --ignore-policy .github/scan/trivy-image-ignore.rego \
            --image-src docker --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-image.json" "$IMAGE_ID"

      - name: Scan filesystem
        if: matrix.target == 'fs'
        run: |
          "$RUNNER_TEMP/trivy" fs --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --skip-check-update --scanners "$TRIVY_SCANNERS" --include-dev-deps \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-fs.json" .

      - name: Validate report
        run: |
          report="$RUNNER_TEMP/trivy-$TRIVY_TARGET.json"
          jq -e 'type == "object" and .SchemaVersion == 2 and (.Results | type == "array")' "$report" > /dev/null
          if [ "$TRIVY_TARGET" = image ]; then
            jq -e --arg image_id "$IMAGE_ID" --arg revision "$GITHUB_SHA" \
              '.ArtifactType == "container_image" and .Metadata.ImageID == $image_id and
               .Metadata.ImageConfig.os == "linux" and .Metadata.ImageConfig.architecture == "amd64" and
               .Metadata.ImageConfig.config.Labels["org.opencontainers.image.revision"] == $revision' "$report" > /dev/null
          else
            jq -e 'any(.Results[]; .Type == "uv" and .Target == "uv.lock") and
              any(.Results[]; .Type == "dockerfile" and .Target == "Dockerfile")' "$report" > /dev/null
          fi

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.target }}
          path: ${{ runner.temp }}/trivy-${{ matrix.target }}.json
          retention-days: 60
          if-no-files-found: error

      - name: Fail on findings
        run: |
          "$RUNNER_TEMP/trivy" convert --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --config "" --ignorefile "" --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" --exit-code 1 --format table "$RUNNER_TEMP/trivy-$TRIVY_TARGET.json"

  trufflehog:
    if: github.event_name != 'pull_request'
    name: trufflehog
    runs-on: ubuntu-latest
    steps:

      - name: Install Trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin ${{ env.TRUFFLEHOG_VERSION }}

      - uses: actions/checkout@v5

      - name: Run Trufflehog FS (report)
        run: |
          ls -lah ${{ github.workspace }}
          trufflehog filesystem ${{ github.workspace }} --results=verified,unknown --json > "${{ github.workspace }}/trufflehog-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: trufflehog-results
          path: "${{ github.workspace }}/trufflehog-results.json"
          retention-days: 60

      - name: Run Trufflehog FS (alert)
        run: |
          trufflehog filesystem ${{ github.workspace }} --results=verified,unknown --fail --github-actions

  gitleaks:
    if: github.event_name != 'pull_request'
    name: gitleaks
    runs-on: ubuntu-latest
    steps:

      - name: Install GitLeaks
        run: |
          git clone --branch ${{ env.GITLEAKS_VERSION }} https://github.com/gitleaks/gitleaks.git /home/runner/.gitleaks
          cd /home/runner/.gitleaks
          make build
          pwd
          ls -lah

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for better secret detection

      - name: Run Gitleaks (report)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --exit-code 0 --report-format json --report-path "${{ github.workspace }}/gitleaks-results.json"

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-results
          path: "${{ github.workspace }}/gitleaks-results.json"
          retention-days: 60

      - name: Run Gitleaks (alert)
        run: |
          export PATH='/home/runner/.gitleaks':$PATH
          gitleaks git . --verbose

  opengrep:
    if: github.event_name != 'pull_request'
    name: opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Opengrep
        run: |
          curl -fsSL -o /tmp/opengrep "https://github.com/opengrep/opengrep/releases/download/${{ env.OPENGREP_VERSION }}/opengrep_linux_x86"
          echo "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0  /tmp/opengrep" | sha256sum -c -
          chmod +x /tmp/opengrep

      - name: Clone Opengrep Rules
        run: |
          git clone https://github.com/opengrep/opengrep-rules.git

      - name: Run Opengrep Scan (report)
        run: |
          export PATH="/tmp:$PATH"
          # Shared exclusions cover noisy Python rules and rules for Django/Flask.
          mapfile -t excluded_rules < .github/opengrep-excluded-rules.txt
          opengrep scan --config opengrep-rules/python "${excluded_rules[@]}" --json -o "${{ github.workspace }}/opengrep-results.json" .

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        with:
          name: opengrep-results
          path: "${{ github.workspace }}/opengrep-results.json"
          retention-days: 60

      - name: Run Opengrep Scan (alert)
        run: |
          export PATH="/tmp:$PATH"
          mapfile -t excluded_rules < .github/opengrep-excluded-rules.txt
          opengrep scan --config opengrep-rules/python "${excluded_rules[@]}" --error .
