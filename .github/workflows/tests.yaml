name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      architectures: ${{ github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]' }}
