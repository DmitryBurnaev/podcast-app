name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - name: Prepare image name and version
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      architectures: '["amd64","arm64"]'

  build:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - name: Publish both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          target: service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=service-amd64
            type=gha,scope=service-arm64

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published platforms
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .github/scripts/verify-platforms "$IMAGE:$VERSION" "$IMAGE:latest"
      - name: Package deployment kit
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash .github/scripts/package-release "$IMAGE:$VERSION" "$VERSION" podcast-app-deploy.tar.gz
          jq -n --arg version "$VERSION" --arg image "$IMAGE:$VERSION" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, docker_image: $image, created_at: $created, platforms: ["linux/amd64", "linux/arm64"]}' > release-metadata.json
          printf '## Podcast App %s\n\nImage: `%s:%s` (AMD64 and ARM64).\n\nDownload `podcast-app-deploy.tar.gz` and follow `INSTALL.md` inside.\n' \
            "$VERSION" "$IMAGE" "$VERSION" > release-body.md
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-kit
          path: |
            podcast-app-deploy.tar.gz
            release-metadata.json
            release-body.md
          retention-days: 14

  create-release:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-kit
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: release-body.md
          files: |
            podcast-app-deploy.tar.gz
            release-metadata.json

  deploy:
    needs: [prepare, verify, create-release]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-kit
      - name: Deliver and deploy the verified release
        env:
          SSH_PKEY: ${{ secrets.SSH_PKEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROD_PROJECT_ROOT: ${{ secrets.PROD_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_PKEY:?}" "${SSH_KNOWN_HOSTS:?}" "${SSH_HOST:?}" "${SSH_USER:?}"
          SSH_PORT=${SSH_PORT:-22}
          PROD_PROJECT_ROOT=${PROD_PROJECT_ROOT:-/opt/podcast-app}
          # Keep remote shell paths predictable; no secret is interpolated as code.
          [[ "$PROD_PROJECT_ROOT" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PKEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            podcast-app-deploy.tar.gz "$SSH_USER@$SSH_HOST:$PROD_PROJECT_ROOT/deploy.tar.gz"
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$PROD_PROJECT_ROOT'; tar -xzf deploy.tar.gz; sudo -n install -m 644 podcast-app.service /etc/systemd/system/podcast-app.service; sudo -n systemctl daemon-reload; bin/deploy"
